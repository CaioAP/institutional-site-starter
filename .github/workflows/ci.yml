name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  build-and-e2e:
    name: Build, e2e + axe
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Clean build + Lighthouse budgets
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No env vars at all: a fresh clone must build with only the documented ones.
      - run: pnpm generate
      - name: Check build output
        run: |
          for f in index.html en.html 404.html en/404.html _headers robots.txt sitemap_index.xml pagefind/pagefind.js; do
            test -f ".output/public/$f" || { echo "missing $f"; exit 1; }
          done
          grep -q "Content-Security-Policy" .output/public/_headers
      - run: pnpm lhci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 7

  cms-samples:
    name: CMS samples (Sanity parity + studio)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Studio typecheck, schema-vs-seed check and build
        run: |
          pnpm --filter @starter/sanity-studio typecheck
          pnpm --filter @starter/sanity-studio check:seed
          pnpm --filter @starter/sanity-studio build
      # The local build also writes Nuxt Content's database, which the checks below read.
      - run: pnpm generate
      - name: Seed is up to date with the local content
        run: |
          pnpm seed:sanity
          git diff --exit-code -- studios/sanity/seed || { echo "Run pnpm seed:sanity and commit studios/sanity/seed"; exit 1; }
      - name: Sanity adapter returns the same content (GROQ over the seed)
        run: pnpm test:build
      - name: Sanity build renders the same pages
        run: |
          mv .output/public "$RUNNER_TEMP/local-build"
          CONTENT_SOURCE=sanity pnpm generate
          node scripts/compare-builds.ts "$RUNNER_TEMP/local-build" .output/public
